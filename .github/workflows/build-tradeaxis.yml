name: Build TradeAxis APK (zip-aware)

# Works whether the repo contains the project as normal files, or only a .zip of it
# (e.g. TradeAxis.zip uploaded straight to GitHub), or a zip that wraps the project in a folder.
#
# Project is picked in this order:
#   1. the zip named in the "zip_path" input (manual run)
#   2. a Gradle project already extracted in the repo
#   3. the first .zip in the repo (up to 2 folders deep) that contains a Gradle project

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:
    inputs:
      zip_path:
        description: 'Optional: path of a project .zip inside the repo (e.g. TradeAxis.zip)'
        required: false
        default: ''
      build_type:
        description: 'Build type'
        required: false
        default: 'debug'
        type: choice
        options: [ debug, release ]

permissions:
  contents: write        # lets tagged builds attach the APK to a GitHub Release

concurrency:
  group: tradeaxis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Locate project and assemble APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Locate project (extracted or inside a zip)
        id: locate
        env:
          INPUT_ZIP: ${{ inputs.zip_path }}
        shell: bash
        run: |
          set -euo pipefail
          WORK="$GITHUB_WORKSPACE"
          OUT="$RUNNER_TEMP/unzipped"
          mkdir -p "$OUT"

          # Shallowest folder (max 4 levels) that holds a Gradle settings file.
          find_project() {
            find "$1" -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) \
              -not -path '*/__MACOSX/*' -not -path '*/.git/*' -not -path '*/node_modules/*' \
              -printf '%d %h\n' 2>/dev/null | sort -n | head -n1 | cut -d' ' -f2-
          }

          # Safely unzip into $OUT/<name>; refuses absolute paths and ../ (zip-slip).
          extract() {
            local zip="$1" dest
            dest="$OUT/$(basename "${zip%.*}")-$RANDOM"
            if unzip -Z1 "$zip" | grep -qE '(^/|(^|/)\.\.(/|$))'; then
              echo "::error::$zip contains unsafe paths (absolute or ../) - refusing to extract" >&2
              return 2
            fi
            mkdir -p "$dest"
            unzip -q -o "$zip" -d "$dest" >&2
            find "$dest" \( -name '__MACOSX' -o -name '.DS_Store' \) -prune -exec rm -rf {} + 2>/dev/null || true
            echo "$dest"
          }

          # Extract a zip, look for a project; if none, look for one more zip inside it (1 level).
          project_from_zip() {
            local zip="$1" depth="${2:-0}" dest proj inner
            dest=$(extract "$zip") || return 2
            proj=$(find_project "$dest")
            if [ -n "$proj" ]; then echo "$proj"; return 0; fi
            if [ "$depth" -lt 1 ]; then
              while IFS= read -r inner; do
                proj=$(project_from_zip "$inner" 1) && [ -n "$proj" ] && { echo "$proj"; return 0; }
              done < <(find "$dest" -maxdepth 3 -iname '*.zip' -not -path '*/__MACOSX/*' | sort)
            fi
            return 1
          }

          PROJECT=""
          SOURCE=""

          # 1) explicit zip from a manual run
          if [ -n "${INPUT_ZIP:-}" ]; then
            [ -f "$WORK/$INPUT_ZIP" ] || { echo "::error::zip_path '$INPUT_ZIP' not found in the repository"; exit 1; }
            PROJECT=$(project_from_zip "$WORK/$INPUT_ZIP") || { echo "::error::No Gradle project (settings.gradle[.kts]) found inside $INPUT_ZIP"; exit 1; }
            SOURCE="zip input: $INPUT_ZIP"
          fi

          # 2) project already extracted in the repo
          if [ -z "$PROJECT" ]; then
            PROJECT=$(find_project "$WORK")
            [ -n "$PROJECT" ] && SOURCE="repository files"
          fi

          # 3) any zip in the repo (names containing tradeaxis/aurum are tried first)
          if [ -z "$PROJECT" ]; then
            mapfile -t ZIPS < <(
              { find "$WORK" -maxdepth 2 -iname '*.zip' -not -path '*/.git/*' | grep -iE 'tradeaxis|tradenova|aurum' | sort
                find "$WORK" -maxdepth 2 -iname '*.zip' -not -path '*/.git/*' | grep -viE 'tradeaxis|tradenova|aurum' | sort
              } || true)
            for z in "${ZIPS[@]}"; do
              [ -n "$z" ] || continue
              echo "Trying $z"
              if PROJECT=$(project_from_zip "$z"); then SOURCE="zip: ${z#$WORK/}"; break; fi
              PROJECT=""
            done
          fi

          if [ -z "$PROJECT" ]; then
            echo "::error::No Gradle project found. Add the project files, or a .zip that contains settings.gradle.kts, to the repository."
            exit 1
          fi

          # version, used to name the APK
          VERSION=$(grep -hoE 'versionName *= *"[^"]+"' "$PROJECT/app/build.gradle.kts" "$PROJECT/app/build.gradle" 2>/dev/null | head -n1 | sed -E 's/.*"([^"]+)".*/\1/' || true)
          VERSION="${VERSION:-1.0}"

          echo "project_dir=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"     >> "$GITHUB_OUTPUT"
          {
            echo "### Project located"
            echo "- Source: **$SOURCE**"
            echo "- Folder: \`${PROJECT#$RUNNER_TEMP/}\`"
            echo "- Version: **$VERSION**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Using project at: $PROJECT ($SOURCE)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"
          TASK="assemble$(echo "${BUILD_TYPE:0:1}" | tr '[:lower:]' '[:upper:]')${BUILD_TYPE:1}"
          # Use the project's own wrapper only if it is complete; zips often drop gradlew / the jar.
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew "$TASK" --no-daemon --stacktrace
          else
            gradle "$TASK" --no-daemon --stacktrace
          fi

      - name: Collect and name the APK
        id: apk
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
          VERSION: ${{ steps.locate.outputs.version }}
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/dist"
          SRC=$(find "$PROJECT_DIR" -path "*/outputs/apk/$BUILD_TYPE/*.apk" | head -n1)
          [ -n "$SRC" ] || { echo "::error::No $BUILD_TYPE APK was produced"; exit 1; }
          NAME="TradeAxis-v${VERSION}-build${GITHUB_RUN_NUMBER}-${BUILD_TYPE}.apk"
          cp "$SRC" "$GITHUB_WORKSPACE/dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "- APK: **$NAME** ($(du -h "$SRC" | cut -f1))" >> "$GITHUB_STEP_SUMMARY"
          if [ "$BUILD_TYPE" = "release" ]; then
            echo "- Note: release APKs are unsigned unless you add a signing config." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TradeAxis-APK
          path: dist/*.apk
          if-no-files-found: error

      - name: Attach APK to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
